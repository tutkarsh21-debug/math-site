<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>No internet | MathSetu</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px/1.6 system-ui,sans-serif;background:#f3f7ff;color:#10182b;text-align:center;padding:1.5rem}
  img{width:72px;height:72px;border-radius:18px}
  h1{font-size:1.5rem;margin:1rem 0 .4rem}
  p{color:#5a6478;margin:0 0 1.4rem;max-width:26rem}
  button{font:inherit;font-weight:600;background:#1557d6;color:#fff;border:0;border-radius:999px;padding:.7rem 1.5rem;cursor:pointer}
  @media(prefers-color-scheme:dark){body{background:#0d1220;color:#eaf0ff}p{color:#9aa6c0}}
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>You are offline</h1>
  <p>MathSetu needs an internet connection to open notes, tests and doubts. Check your connection and try again.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
